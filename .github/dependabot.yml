version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      frontend-toolchain:
        patterns:
          - '@sveltejs/*'
          - '@tailwindcss/*'
          - 'svelte'
          - 'svelte-*'
          - 'tailwindcss'
          - 'vite'
        update-types:
          - minor
          - patch
      backend-runtime:
        patterns:
          - 'hono'
          - 'zod'
        update-types:
          - minor
          - patch
      development-toolchain:
        patterns:
          - '@eslint/*'
          - '@playwright/*'
          - '@types/bun'
          - 'eslint'
          - 'eslint-*'
          - 'globals'
          - 'prettier'
          - 'prettier-*'
          - 'svelte-check'
          - 'typescript'
          - 'typescript-eslint'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
