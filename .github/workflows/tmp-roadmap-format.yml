name: Temporary roadmap formatting

on:
  push:
    branches: [test/accessibility-audits]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format roadmap
        run: bun run prettier --write roadmap.md
      - name: Print formatted roadmap
        run: |
          echo "===ROADMAP_START==="
          cat roadmap.md
          echo "===ROADMAP_END==="
