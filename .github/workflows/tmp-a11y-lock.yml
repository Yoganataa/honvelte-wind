name: Temporary accessibility lockfile generation

on:
  push:
    branches: [test/accessibility-audits]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Resolve workspace dependencies
        run: bun install --no-progress
      - name: Print generated lockfile
        run: |
          echo "===BUN_LOCK_START==="
          cat bun.lock
          echo "===BUN_LOCK_END==="
