name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.WORKER_BASE_URL }}
    env:
      TARGET_ENV: ${{ inputs.target }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      WORKER_NAME: honvelte-wind-${{ inputs.target }}

    steps:
      - name: Checkout the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment target and public URL
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            staging|production) ;;
            *)
              echo "::error::Unsupported deployment target."
              exit 1
              ;;
          esac

          if [[ ! "$WORKER_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Set WORKER_BASE_URL in the selected GitHub Environment to an HTTPS origin without a path."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: bun run test:e2e:install

      - name: Run full repository verification
        run: bun run verify:all

      - name: Test the Cloudflare Fetch adapter
        run: bun test apps/api/src/worker.test.ts

      - name: Smoke-test the selected Worker environment locally
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4.156.0 dev --local --env "$TARGET_ENV" --ip 127.0.0.1 --port 8787 > /tmp/honvelte-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/honvelte-worker-health.json; then
              ready=true
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/honvelte-wrangler.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat /tmp/honvelte-wrangler.log
            exit 1
          fi

          grep -q '"status":"ok"' /tmp/honvelte-worker-health.json
          curl --fail --silent -H 'Sec-Fetch-Mode: navigate' http://127.0.0.1:8787/ > /tmp/honvelte-worker-index.html
          grep -q 'Honvelte Wind' /tmp/honvelte-worker-index.html
          curl --fail --silent -H 'Content-Type: application/json' --data '{"name":"CI"}' http://127.0.0.1:8787/api/greet > /tmp/honvelte-worker-greet.json
          grep -q '"message":"Hello, CI!"' /tmp/honvelte-worker-greet.json

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          npx --yes wrangler@4.156.0 deploy --env "$TARGET_ENV" --message "GitHub Actions run ${GITHUB_RUN_ID} commit ${GITHUB_SHA}"

      - name: Verify the live deployment and roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          smoke_live() {
            local base="${WORKER_BASE_URL%/}"

            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 20 "$base/api/health" --output /tmp/honvelte-live-health.json
            grep -q '"status":"ok"' /tmp/honvelte-live-health.json

            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 -H 'Sec-Fetch-Mode: navigate' "$base/" --output /tmp/honvelte-live-index.html
            grep -q 'Honvelte Wind' /tmp/honvelte-live-index.html

            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 -H 'Content-Type: application/json' --data '{"name":"deployment-smoke-test"}' "$base/api/greet" --output /tmp/honvelte-live-greet.json
            grep -q '"message":"Hello, deployment-smoke-test!"' /tmp/honvelte-live-greet.json
          }

          if smoke_live; then
            echo "Live deployment smoke tests passed."
            exit 0
          fi

          echo "::error::Live deployment smoke tests failed; attempting to restore the previous Worker version."
          if ! npx --yes wrangler@4.156.0 rollback --name "$WORKER_NAME" --message "Automatic rollback after failed smoke test in GitHub Actions run ${GITHUB_RUN_ID}"; then
            echo "::error::Automatic rollback failed. Use the manual Rollback Cloudflare Worker workflow."
            exit 1
          fi

          if ! smoke_live; then
            echo "::error::The previous Worker version was restored, but the live smoke test still fails."
            exit 1
          fi

          echo "The previous Worker version is live again. The deployment run remains failed for investigation."
          exit 1
