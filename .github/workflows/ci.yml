name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', '**/package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Lint, typecheck, unit tests, and build
        run: bun run verify

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', '**/package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Install Playwright Chromium
        run: bun run test:e2e:install

      - name: Run browser tests against production build
        run: bun run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  delivery:
    name: Production delivery bundle
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', '**/package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Build frontend
        run: bun run build

      - name: Assemble Bun deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-bundle
          mkdir -p release-bundle/apps/api release-bundle/apps/web release-bundle/packages/contracts

          cp -R apps/api/src release-bundle/apps/api/
          cp apps/api/package.json release-bundle/apps/api/package.json
          cp apps/web/package.json release-bundle/apps/web/package.json
          cp -R apps/web/dist release-bundle/apps/web/
          cp packages/contracts/package.json release-bundle/packages/contracts/package.json
          cp -R packages/contracts/src release-bundle/packages/contracts/
          cp package.json bunfig.toml .bun-version .env.example README.md release-bundle/

          if [ -f bun.lock ]; then
            cp bun.lock release-bundle/bun.lock
          fi

          cat > release-bundle/DEPLOY.md <<'EOF'
          # Honvelte Wind deployment bundle

          Requirements: the Bun version in `.bun-version`.

          1. Extract this archive.
          2. Install runtime dependencies with `bun install --production`.
          3. Configure `HOST`, `PORT`, and `NODE_ENV=production`.
          4. Start the Hono server with `bun run start`.

          Hono serves the API and the prebuilt Svelte SPA from the same Bun process.
          Do not commit secrets or the production `.env` file into this bundle.
          EOF

          tar -czf "honvelte-wind-${GITHUB_SHA::7}.tar.gz" -C release-bundle .

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: honvelte-wind-production-${{ github.sha }}
          path: honvelte-wind-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
