name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, dependency audit, unit tests with coverage, and build
        run: bun run verify

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run test:e2e:install

      - name: Run browser tests against production build
        run: bun run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  database-examples:
    name: Database adapter examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: honvelte_wind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d honvelte_wind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test SQLite and PostgreSQL examples
        run: bun run test:db-examples
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/honvelte_wind_test
          PGDATABASE: postgres

  auth-examples:
    name: Authentication examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test session, CSRF, OIDC boundary, and RBAC examples
        run: bun run test:auth-examples

  request-safety-examples:
    name: API request safety examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test rate limiting and request deadlines
        run: bun run test:request-safety

  delivery:
    name: Production delivery bundle
    needs: [quality, e2e, database-examples, auth-examples, request-safety-examples]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Assemble Bun deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-bundle
          mkdir -p release-bundle/apps/api release-bundle/apps/web release-bundle/packages/contracts

          cp -R apps/api/src release-bundle/apps/api/
          cp apps/api/package.json release-bundle/apps/api/package.json
          cp apps/web/package.json release-bundle/apps/web/package.json
          cp -R apps/web/dist release-bundle/apps/web/
          cp packages/contracts/package.json release-bundle/packages/contracts/package.json
          cp -R packages/contracts/src release-bundle/packages/contracts/
          cp package.json bunfig.toml .bun-version .env.example README.md release-bundle/

          if [ -f bun.lock ]; then
            cp bun.lock release-bundle/bun.lock
          fi

          cat > release-bundle/DEPLOY.md <<'EOF'
          # Honvelte Wind deployment bundle

          Requirements: the Bun version in `.bun-version`.

          1. Extract this archive.
          2. Install runtime dependencies with `bun install --production`.
          3. Configure `HOST`, `PORT`, and `NODE_ENV=production`.
          4. Start the Hono server with `bun run start`.

          Hono serves the API and the prebuilt Svelte SPA from the same Bun process.
          Do not commit secrets or the production `.env` file into this bundle.
          EOF

          archive="honvelte-wind-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" -C release-bundle .
          test -s "$archive"

          # Verify the extracted artifact, not only the source checkout.
          mkdir -p release-smoke
          tar -xzf "$archive" -C release-smoke
          (
            cd release-smoke
            bun install --production
            NODE_ENV=production HOST=127.0.0.1 PORT=3300 bun run start > /tmp/honvelte-wind-smoke.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT

            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:3300/api/health > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done

            if [ "$ready" != true ]; then
              cat /tmp/honvelte-wind-smoke.log
              exit 1
            fi

            curl --fail --silent http://127.0.0.1:3300/ | grep -q "Honvelte Wind"
          )

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honvelte-wind-production-${{ github.sha }}
          path: honvelte-wind-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
