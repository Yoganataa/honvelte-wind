name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version


      - name: Install dependencies
        run: bun install

      - name: Upload generated lockfile for temporary refresh
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/secure-dependency-refresh'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bun-lock-refresh-${{ github.run_id }}
          path: bun.lock
          if-no-files-found: error
          retention-days: 1

      - name: Inspect low-severity advisories (diagnostic)
        run: bun audit --audit-level=low
        continue-on-error: true

      - name: Lint, typecheck, dependency audit, unit tests, and build
        run: bun run verify

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version


      - name: Install dependencies
        run: bun install

      - name: Inspect low-severity advisories (diagnostic)
        run: bun audit --audit-level=low
        continue-on-error: true

      - name: Install Playwright Chromium
        run: bun run test:e2e:install

      - name: Run browser tests against production build
        run: bun run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  delivery:
    name: Production delivery bundle
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version


      - name: Install dependencies
        run: bun install

      - name: Inspect low-severity advisories (diagnostic)
        run: bun audit --audit-level=low
        continue-on-error: true

      - name: Build frontend
        run: bun run build

      - name: Assemble Bun deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-bundle
          mkdir -p release-bundle/apps/api release-bundle/apps/web release-bundle/packages/contracts

          cp -R apps/api/src release-bundle/apps/api/
          cp apps/api/package.json release-bundle/apps/api/package.json
          cp apps/web/package.json release-bundle/apps/web/package.json
          cp -R apps/web/dist release-bundle/apps/web/
          cp packages/contracts/package.json release-bundle/packages/contracts/package.json
          cp -R packages/contracts/src release-bundle/packages/contracts/
          cp package.json bunfig.toml .bun-version .env.example README.md release-bundle/

          if [ -f bun.lock ]; then
            cp bun.lock release-bundle/bun.lock
          fi

          cat > release-bundle/DEPLOY.md <<'EOF'
          # Honvelte Wind deployment bundle

          Requirements: the Bun version in `.bun-version`.

          1. Extract this archive.
          2. Install runtime dependencies with `bun install --production`.
          3. Configure `HOST`, `PORT`, and `NODE_ENV=production`.
          4. Start the Hono server with `bun run start`.

          Hono serves the API and the prebuilt Svelte SPA from the same Bun process.
          Do not commit secrets or the production `.env` file into this bundle.
          EOF

          archive="honvelte-wind-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" -C release-bundle .
          test -s "$archive"

          # Verify the extracted artifact, not only the source checkout.
          mkdir -p release-smoke
          tar -xzf "$archive" -C release-smoke
          (
            cd release-smoke
            bun install --production
            NODE_ENV=production HOST=127.0.0.1 PORT=3300 bun run start > /tmp/honvelte-wind-smoke.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT

            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:3300/api/health > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done

            if [ "$ready" != true ]; then
              cat /tmp/honvelte-wind-smoke.log
              exit 1
            fi

            curl --fail --silent http://127.0.0.1:3300/ | grep -q "Honvelte Wind"
          )

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honvelte-wind-production-${{ github.sha }}
          path: honvelte-wind-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  lockfile-refresh:
    name: Commit refreshed Bun lockfile
    needs: [quality, e2e]
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'chore/secure-dependency-refresh' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout dependency-refresh branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download generated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" \
            --name "bun-lock-refresh-${GITHUB_RUN_ID}" \
            --dir /tmp/bun-lock-refresh
          test -s /tmp/bun-lock-refresh/bun.lock
          cp /tmp/bun-lock-refresh/bun.lock ./bun.lock

      - name: Commit lockfile and trigger frozen-install verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already matches the dependency graph"
            exit 0
          fi
          git commit -m "chore(deps): refresh Bun lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          gh workflow run ci.yml --ref "${GITHUB_HEAD_REF}"
