name: Rollback Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - staging
          - production
      version_id:
        description: Exact previously deployed Cloudflare Worker version ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.WORKER_BASE_URL }}
    env:
      TARGET_ENV: ${{ inputs.target }}
      VERSION_ID: ${{ inputs.version_id }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      WORKER_NAME: honvelte-wind-${{ inputs.target }}

    steps:
      - name: Checkout the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Validate rollback target and URL
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            staging|production) ;;
            *)
              echo "::error::Unsupported rollback target."
              exit 1
              ;;
          esac

          if [[ ! "$WORKER_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Set WORKER_BASE_URL in the selected GitHub Environment to an HTTPS origin without a path."
            exit 1
          fi

          if [[ ! "$VERSION_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::Provide an exact Cloudflare Worker version UUID."
            exit 1
          fi

      - name: Restore the requested Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          npx --yes wrangler@4.156.0 rollback "$VERSION_ID" --name "$WORKER_NAME" --message "Manual rollback from GitHub Actions run ${GITHUB_RUN_ID}"

      - name: Verify the restored deployment
        shell: bash
        run: |
          set -euo pipefail

          verify_live_assets() {
            local base="$1"
            local html_file="$2"
            local asset
            local asset_path
            local metadata
            local status
            local content_type
            local size_bytes
            local js_count=0
            local css_count=0
            local assets=()

            mapfile -t assets < <(
              grep -Eo '(src|href)="[^"]+"' "$html_file" |
                sed -E 's/^(src|href)="([^"]+)".*$/\\2/' |
                grep -E '^/assets/[^?#]+\\.(js|css)(\\?[^"]*)?          grep -q '"status":"ok"' /tmp/honvelte-rollback-health.json

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 -H 'Sec-Fetch-Mode: navigate' "$base/" --output /tmp/honvelte-rollback-index.html
          grep -q 'Honvelte Wind' /tmp/honvelte-rollback-index.html
          verify_live_assets "$base" /tmp/honvelte-rollback-index.html
 |
                sort -u || true
            )

            if [[ "${#assets[@]}" -eq 0 ]]; then
              echo "::error::The live SPA did not reference any built JavaScript or CSS assets."
              return 1
            fi

            for asset in "${assets[@]}"; do
              metadata="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 --output /dev/null --write-out '%{http_code}|%{content_type}|%{size_download}' "$base$asset")"
              IFS='|' read -r status content_type size_bytes <<< "$metadata"
              asset_path="${asset%%\\?*}"

              if [[ "$status" != "200" || ! "$size_bytes" =~ ^[0-9]+$ || "$size_bytes" -le 0 ]]; then
                echo "::error::Static asset request failed: $asset (HTTP $status, bytes $size_bytes)"
                return 1
              fi

              case "$asset_path" in
                *.js)
                  if [[ "$content_type" != *javascript* ]]; then
                    echo "::error::JavaScript asset has an unexpected content type: $asset ($content_type)"
                    return 1
                  fi
                  js_count=$((js_count + 1))
                  ;;
                *.css)
                  if [[ "$content_type" != text/css* ]]; then
                    echo "::error::CSS asset has an unexpected content type: $asset ($content_type)"
                    return 1
                  fi
                  css_count=$((css_count + 1))
                  ;;
              esac
            done

            if [[ "$js_count" -eq 0 || "$css_count" -eq 0 ]]; then
              echo "::error::Expected at least one JavaScript and one CSS asset; found JS=$js_count CSS=$css_count."
              return 1
            fi

            echo "Verified $js_count JavaScript and $css_count CSS assets on the live Worker."
          }

          base="${WORKER_BASE_URL%/}"

          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 20 "$base/api/health" --output /tmp/honvelte-rollback-health.json
          grep -q '"status":"ok"' /tmp/honvelte-rollback-health.json

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 -H 'Sec-Fetch-Mode: navigate' "$base/" --output /tmp/honvelte-rollback-index.html
          grep -q 'Honvelte Wind' /tmp/honvelte-rollback-index.html
